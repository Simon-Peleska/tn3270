<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TN3270 Terminal</title>

    <!-- Every module, asked for before anything runs so they arrive in one
         wave instead of a round trip per import layer. A new
         module belongs on this list; test/server.test.js holds it against the
         real import graph, so a forgotten one fails the suite rather than
         quietly costing a round trip. -->
    <link rel="modulepreload" href="./app.js" />
    <link rel="modulepreload" href="./canvas.js" />
    <link rel="modulepreload" href="./colors.js" />
    <link rel="modulepreload" href="./hints.js" />
    <link rel="modulepreload" href="./paste.js" />
    <link rel="modulepreload" href="./fitfont.js" />
    <link rel="modulepreload" href="./grid.js" />
    <link rel="modulepreload" href="./paint-runs.js" />
    <link rel="modulepreload" href="./keymap.js" />
    <link rel="modulepreload" href="./macros.js" />
    <link rel="modulepreload" href="./local-host.js" />
    <link rel="modulepreload" href="./oia.js" />
    <link rel="modulepreload" href="./panels.js" />
    <link rel="modulepreload" href="./panel-settings.js" />
    <link rel="modulepreload" href="./panel-logon.js" />
    <link rel="modulepreload" href="./panel-theme.js" />
    <link rel="modulepreload" href="./panel-font.js" />
    <link rel="modulepreload" href="./panel-size.js" />
    <link rel="modulepreload" href="./panel-macros.js" />
    <link rel="modulepreload" href="./panel-recordings.js" />
    <link rel="modulepreload" href="./panel-keys.js" />
    <link rel="modulepreload" href="./panel-admin.js" />
    <link rel="modulepreload" href="./panel-chars.js" />
    <link rel="modulepreload" href="./reconnect.js" />
    <link rel="modulepreload" href="./recorder.js" />
    <link rel="modulepreload" href="./screen-keyboard.js" />
    <link rel="modulepreload" href="./session-api.js" />
    <link rel="modulepreload" href="./settings.js" />
    <link rel="modulepreload" href="./themes.js" />
    <link rel="modulepreload" href="./store.js" />

    <style>
      /* Vendored so any browser gets them. See public/fonts/NOTICE. */
      @font-face {
        font-family: "Fira Mono";
        src: url("./fonts/FiraMono-Regular.woff2") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "IBM 3270";
        src: url("./fonts/3270-Regular.woff2") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("./fonts/IBMPlexMono-Regular.woff2") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "European Teletext";
        src: url("./fonts/EuropeanTeletext.woff2") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "DejaVu Sans Mono";
        src: url("./fonts/DejaVuSansMono.woff2") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "Liberation Mono";
        src: url("./fonts/LiberationMono-Regular.woff2") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("./fonts/JetBrainsMono-Regular.woff2") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "Inconsolata";
        src: url("./fonts/Inconsolata-Regular.woff2") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "Courier Prime";
        src: url("./fonts/CourierPrime-Regular.woff2") format("woff2");
        font-display: block;
      }

      /* Everything visible is drawn on the canvas, so this is the whole of the
         page's styling: give the canvas a box to be measured against, and stop
         a briefly too-large one from growing the page it is measured against. */
      body {
        margin: 0;
        height: 100dvh;
        overflow: hidden;
        background: #000;
      }
      #screen {
        height: 100%;
        overflow: hidden;
        outline: none;
      }
      #canvas {
        display: block;
      }
      #paste-target {
        position: fixed;
        left: -100px;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
    </style>
    <!-- user's font, theme and settings -->
  </head>
  <body>
    <!-- Errors show in place on the status line; a redirect would drop the session. -->
    <main id="screen" tabindex="0">
      <canvas id="canvas"></canvas>
      <textarea id="paste-target" tabindex="-1" aria-hidden="true"></textarea>
    </main>
    <input
      id="recording-import"
      type="file"
      accept=".json,application/json"
      hidden
    />

    <script type="module" src="./app.js"></script>
  </body>
</html>
